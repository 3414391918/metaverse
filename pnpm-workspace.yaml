packages:
  - apps/*
  - packages/*

catalog:
  "@eslint/js": "10.0.1"
  "@types/node": "26.0.1"
  "@vitejs/plugin-vue": "6.0.7"
  "@vue/tsconfig": "0.9.1"
  electron: "42.5.0"
  electron-builder: "26.15.3"
  electron-updater: "6.6.2"
  electron-vite: "5.0.0"
  eslint: "10.8.1"
  eslint-config-prettier: "10.1.8"
  eslint-plugin-vue: "10.10.0"
  globals: "17.11.0"
  naive-ui: "2.44.1"
  pdfjs-dist: "6.1.200"
  pinia: "3.0.4"
  prettier: "3.9.6"
  sharp: "0.35.5"
  typebox: "1.3.7"
  typescript: "6.0.3"
  typescript-eslint: "8.67.0"
  vite: "8.1.0"
  vitest: "4.1.9"
  vue: "3.5.39"
  vue-tsc: "3.3.5"
  zod: "4.4.3"

allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  koffi: true
  node-pty: true
  electron: true
  esbuild: true
  sharp: true
  electron-winstaller: false
  # Transitive packages of the Harness runtime (@deepseek-ai/dsh) do not
  # need install scripts for the packaged desktop runtime.
  "@google/genai": false
  protobufjs: false
